server.port=${PORT:8080}
# folder where every room is saved after each turn
kc.data-dir=${KC_DATA_DIR:./data}
# where the PWA is served from (GitHub Pages); comma separated, * allows all
kc.allowed-origins=${KC_ALLOWED_ORIGINS:*}
spring.jackson.default-property-inclusion=non_null
# the built browser game (client/dist); empty = the server serves only the API and the WebSocket
kc.client-dir=${KC_CLIENT_DIR:}
# an open server: at most so many rooms, and rooms nobody touched for so many days are removed
kc.max-rooms=${KC_MAX_ROOMS:500}
kc.room-idle-days=${KC_ROOM_IDLE_DAYS:14}
# a frozen game (paused) waits this many days for the children to come back
kc.paused-room-days=${KC_PAUSED_ROOM_DAYS:30}
# a game with a turn clock freezes itself when no screen has been connected for this many seconds
kc.auto-pause-seconds=${KC_AUTO_PAUSE_SECONDS:90}
# error pages never show stack traces or messages
server.error.include-stacktrace=never
server.error.include-message=never
# only the game folder above is served, nothing from the server's own classpath
spring.web.resources.add-mappings=false
