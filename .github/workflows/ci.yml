name: Tests

# Every pull request and every change on main: all unit tests, the whole server version played in a real
# browser, and the offline version as a file to download and click through (Actions → this run → Artifacts).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Engine and server tests (and the engine compiled for the offline version)
        run: mvn -B verify

      - name: Client tests and build
        working-directory: client
        run: |
          npm ci
          npm test
          npm run build
          npm run build:offline

      - name: Play the server version in a browser
        run: |
          mkdir -p "$RUNNER_TEMP/rooms"
          KC_CLIENT_DIR=client/dist KC_DATA_DIR="$RUNNER_TEMP/rooms" \
            java -Xmx256m -jar server/target/server-*.jar > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/rules >/dev/null && break; sleep 1; done
          cd client
          npx playwright install --with-deps chromium
          KC_URL=http://localhost:8080 npm run e2e

      - name: Install script against a copy of the Mikrus setup (Docker + pointsapp's Caddy)
        run: sudo bash deploy/test-install.sh

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: client/e2e/out/
          if-no-files-found: ignore

      - name: Offline version to click through
        uses: actions/upload-artifact@v4
        with:
          name: kings-and-castles-offline
          path: client/dist-offline/kings-and-castles-offline.html
