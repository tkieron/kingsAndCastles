name: Fix pointsapp.pl DNS

# One-off, approved by Tomek on 2026-11-19: pointsapp.pl answered 523 because its AAAA record
# pointed to an old IPv6 address. This reads the server's current IPv6 over SSH and moves the
# AAAA record of pointsapp.pl to it (only that one record; www is a CNAME to it).
# Old value for rollback: 2a01:4f9:3a:12ab::213

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/fix-pointsapp-dns.yml']

permissions:
  contents: read

env:
  ZONE: pointsapp.pl
  OLD_IP: 2a01:4f9:3a:12ab::213

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Server IPv6
        id: ip
        env:
          SSH_KEY: ${{ secrets.MIKRUS_SSH_KEY }}
          KNOWN: ${{ secrets.MIKRUS_KNOWN_HOSTS }}
          HOST: ${{ secrets.MIKRUS_HOST }}
          PORT: ${{ secrets.MIKRUS_SSH_PORT }}
          USER_NAME: ${{ secrets.MIKRUS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kc-deploy && chmod 600 ~/.ssh/kc-deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ip6="$(ssh -i ~/.ssh/kc-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$PORT" "${USER_NAME:-root}@$HOST" 'ip -6 addr show scope global | awk "/inet6/ {print \$2}" | cut -d/ -f1 | head -1')"
          rm -f ~/.ssh/kc-deploy
          [[ "$ip6" =~ ^[0-9a-f:]+$ ]] || { echo "::error::no IPv6 from the server"; exit 1; }
          echo "server IPv6: $ip6"
          echo "ip6=$ip6" >> "$GITHUB_OUTPUT"

      - name: Update the AAAA record
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEW_IP: ${{ steps.ip.outputs.ip6 }}
        run: |
          api=https://api.cloudflare.com/client/v4
          zone="$(curl -sS -H "Authorization: Bearer $CF" "$api/zones?name=$ZONE" | jq -r '.result[0].id // empty')"
          [ -n "$zone" ] || { echo "::error::zone not found"; exit 1; }
          recs="$(curl -sS -H "Authorization: Bearer $CF" "$api/zones/$zone/dns_records?type=AAAA&name=$ZONE")"
          [ "$(echo "$recs" | jq '.result | length')" = 1 ] || { echo "::error::expected exactly one AAAA record"; echo "$recs" | jq -c '[.result[] | {content, proxied}]'; exit 1; }
          id="$(echo "$recs" | jq -r '.result[0].id')"
          cur="$(echo "$recs" | jq -r '.result[0].content')"
          echo "before: $(echo "$recs" | jq -c '.result[0] | {content, proxied, ttl, modified_on}')"
          if [ "$cur" = "$NEW_IP" ]; then echo "already correct"; exit 0; fi
          [ "$cur" = "$OLD_IP" ] || { echo "::error::record is $cur, not the expected old value; not touching it"; exit 1; }
          r="$(curl -sS -X PATCH -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' \
            --data "{\"content\":\"$NEW_IP\"}" "$api/zones/$zone/dns_records/$id")"
          echo "$r" | jq -e '.success' >/dev/null || { echo "::error::update failed: $(echo "$r" | jq -c '.errors')"; exit 1; }
          echo "after: $(echo "$r" | jq -c '.result | {content, proxied, ttl, modified_on}')"

      - name: pointsapp.pl from the internet
        run: |
          for i in $(seq 1 12); do
            a="$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://pointsapp.pl/)"
            b="$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://www.pointsapp.pl/)"
            echo "try $i: pointsapp.pl -> $a, www -> $b"
            [ "$a" = 200 ] && [ "$b" = 200 ] && exit 0
            sleep 15
          done
          echo "::error::pointsapp.pl is still not 200"; exit 1
